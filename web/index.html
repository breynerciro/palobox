<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PaloBox">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<title>PaloBox</title>
</head>
<body>

<!-- Íconos (trazo estilo Lucide). Se usan con <svg><use href="#i-..."/></svg>. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
    <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M12 10v6M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></symbol>
    <symbol id="i-file-text" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.97a4 4 0 0 0 3.3-1.7l5.46-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.97a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.04a4 4 0 0 1-3.3-1.8l-.36-.45"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-skip" viewBox="0 0 24 24"><path d="M5 5.5v13a1 1 0 0 0 1.55.83l9.5-6.5a1 1 0 0 0 0-1.66l-9.5-6.5A1 1 0 0 0 5 5.5Z" fill="currentColor" stroke="none"/><rect x="17" y="4" width="3" height="16" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 5.5v13a1 1 0 0 1-1.55.83l-9.5-6.5a1 1 0 0 1 0-1.66l9.5-6.5A1 1 0 0 1 19 5.5Z" fill="currentColor" stroke="none"/><rect x="4" y="4" width="3" height="16" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-repeat-1" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .71-1.53l7-6a2 2 0 0 1 2.58 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="m16 6 4 14M12 6v14M8 8v12M4 4v16"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="M21 15V6M12 12H3M16 6H3M12 18H3"/><circle cx="18.5" cy="15.5" r="2.5"/></symbol>
    <symbol id="i-list-plus" viewBox="0 0 24 24"><path d="M11 12H3M16 6H3M16 18H3M18 9v6M21 12h-6"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M21.17 6.81a1 1 0 0 0-3.98-3.98L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.36a.5.5 0 0 0 .62.62L7 20.66a2 2 0 0 0 .83-.5Z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="2"/></symbol>
  </defs>
</svg>

<main id="login" class="login" hidden>
  <div class="login-card">
    <img class="logo" src="icon.svg" alt="">
    <h1>PaloBox</h1>
    <p class="muted">Tus fotos, archivos y música en un solo lugar.</p>
    <form id="login-form" novalidate>
      <label for="u">Usuario</label>
      <input id="u" name="name" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <label for="p">Contraseña</label>
      <input id="p" name="pass" type="password" autocomplete="current-password" required>
      <p id="login-error" class="field-error" role="alert"></p>
      <button class="btn primary block" id="login-btn">Entrar</button>
    </form>
  </div>
</main>

<div id="app" hidden>
  <!-- Barra lateral de Música: solo en escritorio (≥ 900 px). -->
  <aside id="side" class="side" aria-label="Música" hidden>
    <a class="side-brand" href="#/fotos" id="side-exit"><img src="icon.svg" alt="">PaloBox</a>
    <nav aria-label="Navegación de música">
      <a href="#/musica" data-m="inicio"><svg><use href="#i-home"/></svg>Inicio</a>
      <a href="#/musica/buscar" data-m="buscar"><svg><use href="#i-search"/></svg>Buscar</a>
    </nav>
    <div class="side-head">
      <a href="#/musica/biblioteca" data-m="biblioteca"><svg><use href="#i-library"/></svg>Tu biblioteca</a>
      <button id="side-new" class="icon-btn" aria-label="Crear playlist"><svg><use href="#i-plus"/></svg></button>
    </div>
    <ul id="side-list" class="side-list"></ul>
    <nav class="side-foot" aria-label="Secciones">
      <a href="#/fotos"><svg><use href="#i-image"/></svg>Fotos</a>
      <a href="#/archivos"><svg><use href="#i-folder"/></svg>Archivos</a>
    </nav>
  </aside>

  <header class="topbar">
    <div class="topbar-row">
      <button id="back" class="btn ghost back" hidden><svg><use href="#i-back"/></svg><span id="back-label"></span></button>
      <span class="spacer"></span>
      <button id="mkdir" class="icon-btn" aria-label="Nueva carpeta" hidden><svg><use href="#i-folder-plus"/></svg></button>
      <button id="add" class="btn primary small" hidden><svg><use href="#i-upload"/></svg>Subir</button>
      <a id="admin-link" class="icon-btn" href="#/admin" aria-label="Administración" hidden><svg><use href="#i-activity"/></svg></a>
      <button id="logout" class="icon-btn" aria-label="Cerrar sesión"><svg><use href="#i-logout"/></svg></button>
    </div>
    <h1 id="title">Fotos</h1>
    <p id="subtitle" class="muted"></p>
    <form id="searchbox" class="searchbox" role="search" hidden>
      <svg aria-hidden="true"><use href="#i-search"/></svg>
      <input id="search" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" aria-label="Buscar en tu música o pegar un enlace de Spotify">
      <button type="button" id="search-clear" class="icon-btn small" aria-label="Borrar búsqueda" hidden><svg><use href="#i-x"/></svg></button>
    </form>
  </header>

  <main id="view"></main>

  <div id="dock">
    <!-- Progreso de subida: píldora compacta que se puede minimizar mientras sigue subiendo. -->
    <div id="upbar" hidden>
      <div id="upbar-full" class="upbar-full" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Subida">
        <svg class="toast-icon"><use href="#i-upload"/></svg>
        <span id="upbar-text"></span>
        <button id="upbar-hide" class="icon-btn small" aria-label="Minimizar el progreso de la subida"><svg><use href="#i-down"/></svg></button>
        <span class="upbar-line"><span></span></span>
      </div>
      <button id="upbar-show" class="upbar-mini" aria-label="Mostrar el progreso de la subida" hidden><svg><use href="#i-upload"/></svg><span id="upbar-pct"></span></button>
    </div>

    <div id="toast" role="status" hidden>
      <div class="toast-row">
        <svg class="toast-icon"><use href="#i-upload"/></svg>
        <p id="toast-text"></p>
        <button id="toast-close" class="icon-btn small" aria-label="Cerrar aviso"><svg><use href="#i-x"/></svg></button>
      </div>
    </div>

    <section id="player" aria-label="Reproductor" hidden>
      <span class="player-grip" aria-hidden="true"></span>
      <div class="player-left">
        <button id="player-open" class="player-open" aria-label="Abrir reproductor">
          <span class="cover small" id="player-cover" style="--tc: var(--t-audio)"><svg><use href="#i-music"/></svg></span>
          <span class="player-text">
            <span id="now" class="ellipsis"></span>
            <span id="now-sub" class="muted ellipsis"></span>
          </span>
        </button>
        <button class="icon-btn like" data-like="" aria-label="Me gusta" aria-pressed="false"><svg><use href="#i-heart"/></svg></button>
        <!-- Solo en Fotos y Archivos; en el celular se ve al enfocarlo (con el dedo se desliza hacia abajo). -->
        <button id="player-tuck" class="icon-btn" aria-label="Ocultar reproductor (la música sigue sonando)"><svg><use href="#i-down"/></svg></button>
      </div>
      <div class="player-mid">
        <div class="player-btns">
          <button class="icon-btn toggle wide" data-act="shuffle" aria-label="Aleatorio" aria-pressed="false"><svg><use href="#i-shuffle"/></svg></button>
          <button id="prev" class="icon-btn" aria-label="Canción anterior"><svg><use href="#i-prev"/></svg></button>
          <button id="playpause" class="icon-btn play" aria-label="Reproducir"><svg><use href="#i-play"/></svg></button>
          <button id="next" class="icon-btn" aria-label="Siguiente canción"><svg><use href="#i-skip"/></svg></button>
          <button class="icon-btn toggle wide" data-act="repeat" aria-label="Repetir" aria-pressed="false"><svg><use href="#i-repeat"/></svg></button>
        </div>
        <div class="player-seek">
          <span id="cur" class="muted wide">0:00</span>
          <input id="seek" class="seek" type="range" min="0" max="1000" value="0" aria-label="Posición de la canción">
          <span id="dur" class="muted wide">0:00</span>
        </div>
      </div>
      <div class="player-right wide">
        <button class="icon-btn" data-act="queue" aria-label="Cola de reproducción"><svg><use href="#i-queue"/></svg></button>
        <svg class="muted"><use href="#i-volume"/></svg>
        <input id="volume" class="seek" type="range" min="0" max="100" value="100" aria-label="Volumen">
      </div>
    </section>
    <button id="player-tab" class="player-tab" aria-label="Mostrar reproductor"><svg><use href="#i-music"/></svg></button>

    <nav id="tabs" class="tabs" aria-label="Secciones">
      <a href="#/fotos" data-tab="fotos"><svg><use href="#i-image"/></svg>Fotos</a>
      <a href="#/archivos" data-tab="archivos"><svg><use href="#i-folder"/></svg>Archivos</a>
      <a href="#/musica" data-tab="musica"><svg><use href="#i-music"/></svg>Música</a>
    </nav>
    <!-- Dentro de Música la barra inferior es la de la sección; «Nube» devuelve a Fotos y Archivos. -->
    <nav id="mtabs" class="tabs" aria-label="Música" hidden>
      <a href="#/musica" data-m="inicio"><svg><use href="#i-home"/></svg>Inicio</a>
      <a href="#/musica/buscar" data-m="buscar"><svg><use href="#i-search"/></svg>Buscar</a>
      <a href="#/musica/biblioteca" data-m="biblioteca"><svg><use href="#i-library"/></svg>Tu biblioteca</a>
      <a href="#/fotos" id="mtabs-exit" class="exit" aria-label="Volver a Fotos y Archivos"><svg><use href="#i-cloud"/></svg>Nube</a>
    </nav>
  </div>
</div>

<dialog id="viewer" aria-label="Visor">
  <div class="viewer-bar">
    <button id="v-close" class="icon-btn on-dark" aria-label="Cerrar"><svg><use href="#i-x"/></svg></button>
    <div class="viewer-title"><p id="v-title" class="ellipsis"></p><p id="v-sub" class="ellipsis"></p></div>
    <a id="v-dl" class="icon-btn on-dark" aria-label="Descargar original"><svg><use href="#i-download"/></svg></a>
    <button id="v-del" class="icon-btn on-dark" aria-label="Eliminar"><svg><use href="#i-trash"/></svg></button>
  </div>
  <div id="stage"></div>
  <button id="v-prev" class="icon-btn on-dark nav-arrow left" aria-label="Anterior"><svg><use href="#i-back"/></svg></button>
  <button id="v-next" class="icon-btn on-dark nav-arrow right" aria-label="Siguiente"><svg><use href="#i-next"/></svg></button>
</dialog>

<dialog id="np" aria-label="Reproduciendo">
  <div class="np-bar">
    <button id="np-close" class="icon-btn" aria-label="Cerrar reproductor"><svg><use href="#i-down"/></svg></button>
    <p class="muted">Reproduciendo</p>
    <button class="icon-btn" data-act="queue" aria-label="Cola de reproducción"><svg><use href="#i-queue"/></svg></button>
  </div>
  <div class="cover np-cover" id="np-cover" style="--tc: var(--t-audio)"><svg><use href="#i-music"/></svg></div>
  <div class="np-head">
    <div class="np-text">
      <p id="np-title"></p>
      <p id="np-sub" class="muted"></p>
    </div>
    <button class="icon-btn like" data-like="" aria-label="Me gusta" aria-pressed="false"><svg><use href="#i-heart"/></svg></button>
  </div>
  <div>
    <input id="np-seek" class="seek" type="range" min="0" max="1000" value="0" aria-label="Posición de la canción">
    <div class="np-times muted"><span id="np-cur">0:00</span><span id="np-dur">0:00</span></div>
  </div>
  <div class="np-controls">
    <button class="icon-btn toggle" data-act="shuffle" aria-label="Aleatorio" aria-pressed="false"><svg><use href="#i-shuffle"/></svg></button>
    <button id="np-prev" class="icon-btn" aria-label="Canción anterior"><svg><use href="#i-prev"/></svg></button>
    <button id="np-play" class="icon-btn play-big" aria-label="Reproducir"><svg><use href="#i-play"/></svg></button>
    <button id="np-next" class="icon-btn" aria-label="Siguiente canción"><svg><use href="#i-skip"/></svg></button>
    <button class="icon-btn toggle" data-act="repeat" aria-label="Repetir" aria-pressed="false"><svg><use href="#i-repeat"/></svg></button>
  </div>
</dialog>

<dialog id="queue" class="panel" aria-labelledby="queue-title">
  <div class="panel-head">
    <h2 id="queue-title">Cola</h2>
    <button id="queue-close" class="icon-btn" aria-label="Cerrar cola"><svg><use href="#i-x"/></svg></button>
  </div>
  <div id="queue-body"></div>
</dialog>

<dialog id="menu" class="menu"><ul id="menu-list" role="menu"></ul></dialog>

<dialog id="ask" class="sheet">
  <form method="dialog">
    <h2 id="ask-title"></h2>
    <p id="ask-text" class="muted"></p>
    <label for="ask-input" id="ask-label" class="sr-only">Nombre</label>
    <input id="ask-input" autocomplete="off">
    <div class="sheet-actions">
      <button value="" class="btn secondary" formnovalidate>Cancelar</button>
      <button value="ok" id="ask-ok" class="btn primary">Aceptar</button>
    </div>
  </form>
</dialog>

<input id="pick-media" type="file" multiple accept="image/*,video/*" hidden>
<input id="pick-file" type="file" multiple hidden>
<script type="module" src="app.js"></script>
</body>
</html>
