# Dos formas de usarlo: `docker compose up -d --build` con el código al lado, o ./deploy.sh,
# que compila en el PC de desarrollo y solo envía las imágenes (el servidor no guarda código).
# ADMIN, DATA_PATH y TZ salen de .env (ver .env.example).
# Tope de logs: sin esto json-file crece sin límite.
x-logs: &logs
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  palobox:
    image: palobox
    logging: *logs
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"] # solo para tailscale serve; el túnel de Cloudflare entra por la red de compose, no por aquí
    volumes: ["${DATA_PATH:-/srv/data}:/data"]
    environment:
      ADMIN: ${ADMIN:-admin} # usuario que ve el panel de administrador
      TZ: ${TZ:-America/Bogota}
      MUSIC_MAX: ${MUSIC_MAX:-15000} # tope de canciones: al llegar, solo el administrador descarga más (0 = sin tope)
      SPOTDL_URL: http://spotdl:8801 # descargas de Spotify; sin el servicio, la sección queda oculta
      SPOTDL_TOKEN_FILE: /run/secrets/spotdl_token # sin token la sección también queda oculta
      # Gemini clasifica el género de los artistas nuevos y arma playlists por descripción; sin la llave, ambas cosas se apagan.
      GEMINI_KEY_FILE: /run/secrets/gemini_key
      GEMINI_PER_DAY: ${GEMINI_PER_DAY:-300} # solicitudes al día entre todas las cuentas
    secrets: [spotdl_token, gemini_key]
    # deploy.sh espera este chequeo (up --wait) antes de borrar la imagen anterior.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/version"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s

  # Servicio propio de descargas de Spotify (no la imagen oficial): recibe enlaces de la
  # app, los resuelve con spotDL y escribe los MP3 en /data/media/musica.
  # No publica puerto: solo lo alcanza la app por la red de compose, y con su token.
  spotdl:
    image: palobox-spotdl
    logging: *logs
    build: ./spotdl
    restart: unless-stopped
    # Las descargas copan el procesador (convertir a MP3, resolver YouTube). Con este peso, cuando la app también
    # lo necesita (música sonando, fotos) se lleva unas 5 de cada 6 partes (peso 100 contra 21, medido en el
    # servidor); si nadie más lo pide, las descargas van igual de rápido.
    cpu_shares: 128
    user: "1000:1000" # mismos dueños que la app y Samba
    # DNS fijo: si Tailscale cambia el DNS del servidor, el contenedor viejo deja de resolver YouTube.
    dns: [1.1.1.1, 8.8.8.8]
    # Solo la biblioteca y su propio estado: no ve la base de la app ni los archivos de los usuarios.
    volumes:
      - ${DATA_PATH:-/srv/data}/media/musica:/data/media/musica
      - ${DATA_PATH:-/srv/data}/.palobox/spotdl:/data/.palobox/spotdl
    secrets: [spotdl_token]
    environment:
      TZ: ${TZ:-America/Bogota}
      TOKEN_FILE: /run/secrets/spotdl_token
      # Opcionales, para cuando YouTube pida credenciales:
      # SPOTIFY_CLIENT_ID: ""
      # SPOTIFY_CLIENT_SECRET: ""
      # SPOTDL_COOKIE_FILE: /data/.palobox/spotdl/cookies.txt
      MAX_ACTIVE: "30" # trabajos en cola a la vez; con 5 (el valor del servicio) el sexto pedido de 55 cuentas se rechaza
      # MAX_PER_USER: "2"
      SPOTDL_OFFICIAL: ${SPOTDL_OFFICIAL:-1} # 1: audio de canales verificados o «Topic», y solo si no existe, el video que mejor coincida; 0: siempre ese
      THREADS: ${SPOTDL_THREADS:-4} # canciones a la vez (4 es el valor de spotDL); bájalo en .env si YouTube pide verificación
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; t = open('/run/secrets/spotdl_token').read().strip(); u.urlopen(u.Request('http://127.0.0.1:8801/health', headers={'Authorization': 'Bearer ' + t}), timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Acceso público por Cloudflare Tunnel: sale hacia Cloudflare, sin abrir puertos (sirve con CGNAT).
  # Opcional: se enciende con COMPOSE_PROFILES=tunnel en .env. En el panel de Cloudflare, el hostname
  # público apunta a http://palobox:8080 (la red de compose), así clientIP toma la IP real de X-Forwarded-For.
  cloudflared:
    image: cloudflare/cloudflared:latest
    logging: *logs
    profiles: [tunnel]
    restart: unless-stopped
    # http2 (TCP) y no quic: por UDP el túnel se caía a diario («failed to dial to edge with quic: timeout», 55 reconexiones en 6 días).
    command: tunnel --no-autoupdate --protocol http2 run --token-file /run/secrets/cloudflared_token
    secrets: [cloudflared_token]
    depends_on: [palobox]

# Un secreto por módulo, compartido solo entre la app y ese módulo. Lo crea deploy.sh en el
# servidor (secrets/ es 700; el archivo 644 para que lo lea el usuario 1000 del contenedor).
secrets:
  spotdl_token:
    file: ./secrets/spotdl.token
  # Llave de la API de Gemini (aistudio.google.com); se copia a mano al servidor. Si no existe, deploy.sh deja el archivo vacío.
  gemini_key:
    file: ./secrets/gemini.key
  # Token del túnel (panel de Cloudflare); se copia a mano al servidor, ver README.
  cloudflared_token:
    file: ./secrets/cloudflared.token
