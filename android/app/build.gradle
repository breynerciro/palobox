// La app de PaloBox para Android (teléfono y televisor): la web en un WebView propio, con lo de sistema en nativo
// (servicio en primer plano, notificación y pantalla bloqueada). Ver LauncherActivity.
plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services' // lee google-services.json (proyecto palobox-app de Firebase)
}

android {
    compileSdk 36
    namespace 'org.dpdns.palobox.twa'
    defaultConfig {
        applicationId 'org.dpdns.palobox.twa' // el de la versión TWA: así se instala encima y conserva la firma
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '2'
        buildConfigField 'String', 'HOST', '"palobox.dpdns.org"'
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false // con R8, Firebase Installations falla («Service is unavailable») y no hay token de push
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    // Push de Firebase: despierta la app cuando le pasan la música desde otro dispositivo (PushService).
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
